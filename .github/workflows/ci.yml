name: Build and test (.NET 10)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AmvrosiaTaxSync.slnx
      - name: Build
        run: dotnet build AmvrosiaTaxSync.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/MoonHard.AmvrosiaTaxSync.Tests/MoonHard.AmvrosiaTaxSync.Tests.csproj -c Release --no-build
      - name: NuGet security audit
        run: dotnet list src/MoonHard.AmvrosiaTaxSync.Desktop/MoonHard.AmvrosiaTaxSync.Desktop.csproj package --vulnerable --include-transitive
